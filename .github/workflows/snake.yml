# Place this file at exactly: .github/workflows/snake.yml
# in your AyushNeedsCaffeine/AyushNeedsCaffeine repo (the one that powers your profile README).

name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"    # regenerates once a day at midnight UTC
  workflow_dispatch:         # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
